repos:
  # -----------------------
  # Ruff (lint + format)
  # -----------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # -----------------------
  # Mypy (type checking)
  # -----------------------
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        types: [python]
        additional_dependencies:
          - sqlalchemy>=2.0.44
        args: ["--config-file=backend/pyproject.toml"]
        files: ^backend/(app|library|commandline_interface)/  # skip backend/tests

  # -----------------------
  # Frontend checks
  # -----------------------
  - repo: local
    hooks:
      - id: frontend-eslint
        name: frontend-eslint
        language: system
        # Always rebuild the `dev` stage (has npm + devDependencies; the
        # default/last stage is the nginx runtime image, which has no npm).
        # Docker layer-caches the `npm i` layer, so this is fast unless
        # package.json/package-lock.json changed. No bind mount, so a
        # stale image can never linger and node_modules is never shadowed.
        entry: bash -c 'docker build -q -f frontend/Dockerfile --target dev -t todo-app-frontend-dev ./frontend && docker run --rm todo-app-frontend-dev npm run lint'
        pass_filenames: false
        files: ^frontend/.*\.(js|jsx)$

      - id: frontend-format-check
        name: frontend-format-check
        language: system
        entry: bash -c 'docker build -q -f frontend/Dockerfile --target dev -t todo-app-frontend-dev ./frontend && docker run --rm todo-app-frontend-dev npm run format:check'
        pass_filenames: false
        files: ^frontend/


  # -----------------------
  # General hygiene
  # -----------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: \.(py|yml|yaml|md|txt|sh|toml|json)$
      - id: end-of-file-fixer
        files: \.(py|yml|yaml|md|txt|sh|toml|json)$
