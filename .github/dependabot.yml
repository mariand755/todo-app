version: 2
updates:
  # "uv" (not "pip") so Dependabot regenerates uv.lock alongside pyproject.toml.
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    groups:
      dev-dependencies:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
          - "pre-commit"
      # One PR for all security fixes. Separate lock-only PRs each re-resolve
      # uv.lock and conflict with each other (see #181/#182/#184/#186).
      security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
      day: "tuesday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
      react-stack-minor:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "minor"
          - "patch"
      # vitest and @vitest/* peer-depend on the exact same version, so they must
      # always move together, majors included (a lone vitest 5 bump in #193
      # broke `npm ci` everywhere). Listed before test-and-lint-minor so it wins.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      test-and-lint-minor:
        patterns:
          - "@testing-library/*"
          - "eslint*"
          - "prettier"
          - "@vitejs/*"
          - "vite"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "monthly"
      day: "wednesday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 2

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "monthly"
      day: "wednesday"
      time: "06:30"
      timezone: "UTC"
    open-pull-requests-limit: 2

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "thursday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 2
