# Builds the frontend Docker image, runs lint, format checks, and the full
# Vitest suite inside the container, then scans the image with Trivy for
# HIGH/CRITICAL vulnerabilities. Same idea as docker_backend but for the
# React/Vite side of the app.
#
# Jobs:
#   detect-relevant-changes — skips if no frontend/docker/workflow files changed
#   docker-build-and-test   — build image, lint + tests in container, Trivy scan
#   docker-frontend-gate    — blocks merge on failure

name: Docker Frontend

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

  workflow_dispatch:

concurrency:
  group: docker-frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-relevant-changes:
    runs-on: ubuntu-latest

    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Detect frontend docker-relevant changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "$base" "$head" > changed_files.txt

          if grep -E -q '^(frontend/|docker-compose\.yaml|\.github/workflows/)' changed_files.txt; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  docker-build-and-test:
    needs: detect-relevant-changes
    if: needs.detect-relevant-changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build frontend image (dev target)
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: dev
          push: false
          tags: frontend:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run frontend lint in container
        run: docker run --rm --init --pull=never frontend:test npm run lint

      - name: Run frontend format check in container
        run: docker run --rm --init --pull=never frontend:test npm run format:check

      - name: Run all frontend tests in container
        run: docker run --rm --init --pull=never frontend:test npm run test

      - name: Run frontend coverage in container
        run: docker run --rm --init --pull=never frontend:test npm run coverage

      - name: Run frontend integration tests in container
        run: docker run --rm --init --pull=never frontend:test npm run test -- --run src/test/integration

      - name: Run frontend unit tests in container
        run: docker run --rm --init --pull=never frontend:test npm run test -- --run src/test/unit

      - name: Build frontend runtime image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: runtime
          push: false
          tags: frontend:runtime
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan runtime (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: frontend:runtime
          format: table
          output: trivy-frontend-pr.txt
          ignore-unfixed: true
          vuln-type: library
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Upload Trivy frontend artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-frontend-pr
          path: trivy-frontend-pr.txt
          retention-days: 14
          if-no-files-found: warn

  docker-frontend-gate:
    needs: [detect-relevant-changes, docker-build-and-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        run: |
          if [[ "${{ needs.docker-build-and-test.result }}" == "failure" || "${{ needs.docker-build-and-test.result }}" == "cancelled" ]]; then
            echo "docker-build-and-test failed or was cancelled"
            exit 1
          fi
          echo "Docker frontend gate passed (job succeeded or was skipped)"
