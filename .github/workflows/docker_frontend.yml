name: Docker Frontend

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "docker-compose.yaml"
      - ".github/workflows/docker_frontend.yml"

  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "docker-compose.yaml"
      - ".github/workflows/docker_frontend.yml"

  workflow_dispatch:

concurrency:
  group: docker-frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: frontend:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run frontend lint in container
        run: docker run --rm --init --pull=never frontend:test npm run lint

      - name: Run frontend format check in container
        run: docker run --rm --init --pull=never frontend:test npm run format:check

      - name: Run all frontend tests in container
        run: docker run --rm --init --pull=never frontend:test npm run test

      - name: Run frontend integration tests in container
        run: docker run --rm --init --pull=never frontend:test npm run test -- --run src/test/integration

      - name: Run frontend unit tests in container
        run: docker run --rm --init --pull=never frontend:test npm run test -- --run src/test/unit
