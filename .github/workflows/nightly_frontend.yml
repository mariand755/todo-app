name: Nightly Frontend

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-frontend
  cancel-in-progress: true

jobs:
  frontend-quality-and-audit:
    name: Frontend quality + dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ./frontend/

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Run tests
        run: npm run test

      - name: Run coverage
        run: npm run coverage

      - name: Upload frontend coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-nightly
          path: frontend/coverage
          retention-days: 30
          if-no-files-found: warn

      - name: Dependency audit (npm audit)
        run: npm audit --audit-level=high

  docker-build-and-trivy:
    name: Docker build + Trivy scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build frontend image (local)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: frontend:nightly
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.34.0
        with:
          image-ref: frontend:nightly
          format: table
          output: trivy-frontend-nightly.txt
          ignore-unfixed: true
          vuln-type: library
          skip-dirs: /usr/local/lib/node_modules/npm
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Upload Trivy frontend artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-frontend-nightly
          path: trivy-frontend-nightly.txt
          retention-days: 30
          if-no-files-found: warn
