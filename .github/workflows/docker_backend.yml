# Builds the backend Docker image in both test and runtime targets, runs the
# full test suite inside the container, then scans both images with Trivy for
# HIGH/CRITICAL vulnerabilities. This validates that the Dockerfile itself
# produces a working, secure image — not just that the code passes locally.
#
# Jobs:
#   detect-relevant-changes — skips if no backend/docker/workflow files changed
#   docker-build-and-scan   — build test + runtime images, pytest in container, Trivy scan
#   docker-backend-gate     — blocks merge on failure

name: Docker Backend

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

  workflow_dispatch:

concurrency:
  group: docker-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-relevant-changes:
    runs-on: ubuntu-latest

    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Detect backend docker-relevant changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "$base" "$head" > changed_files.txt

          if grep -E -q '^(backend/|docker-compose\.yaml|\.github/workflows/)' changed_files.txt; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  docker-build-and-scan:
    needs: detect-relevant-changes
    if: needs.detect-relevant-changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image (test target)
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: test
          push: false
          tags: backend:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests in container
        run: docker run --rm --init --pull=never backend:test uv run pytest -q -o addopts='' --cov=app --cov=library --cov-report=term-missing --cov-fail-under=85

      - name: Run integration tests in container
        run: docker run --rm --init --pull=never backend:test uv run pytest -q -o addopts='' -m integration

      - name: Run unit tests in container
        run: docker run --rm --init --pull=never backend:test uv run pytest -q -o addopts='' -m unit

      - name: Trivy scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: backend:test
          format: table
          output: trivy-backend-test-pr.txt
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: backend/.trivyignore-test-tooling

      - name: Build backend runtime image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: runtime
          push: false
          tags: backend:runtime
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan runtime (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: backend:runtime
          format: table
          output: trivy-backend-runtime-pr.txt
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Upload Trivy backend artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-backend-pr
          path: |
            trivy-backend-test-pr.txt
            trivy-backend-runtime-pr.txt
          retention-days: 14
          if-no-files-found: warn

  docker-backend-gate:
    needs: [detect-relevant-changes, docker-build-and-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        run: |
          if [[ "${{ needs.docker-build-and-scan.result }}" == "failure" || "${{ needs.docker-build-and-scan.result }}" == "cancelled" ]]; then
            echo "docker-build-and-scan failed or was cancelled"
            exit 1
          fi
          echo "Docker backend gate passed (job succeeded or was skipped)"
