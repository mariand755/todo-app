name: Docker Backend

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yaml"
      - ".github/workflows/**"

  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yaml"
      - ".github/workflows/**"

  workflow_dispatch:

concurrency:
  group: docker-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-build-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (test target)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: test
          push: false
          tags: backend:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests in container
        run: docker run --rm --init --pull=never backend:test uv run pytest -q -o addopts='' --cov=app --cov=library --cov-report=term-missing --cov-fail-under=85

      - name: Run integration tests in container
        run: docker run --rm --init --pull=never backend:test uv run pytest -q -o addopts='' -m integration

      - name: Run unit tests in container
        run: docker run --rm --init --pull=never backend:test uv run pytest -q -o addopts='' -m unit

      - name: Trivy scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.34.0
        with:
          image-ref: backend:test
          format: table
          output: trivy-backend-test-pr.txt
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Build backend runtime image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: runtime
          push: false
          tags: backend:runtime
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan runtime (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.34.0
        with:
          image-ref: backend:runtime
          format: table
          output: trivy-backend-runtime-pr.txt
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Upload Trivy backend artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-backend-pr
          path: |
            trivy-backend-test-pr.txt
            trivy-backend-runtime-pr.txt
          retention-days: 14
          if-no-files-found: warn
