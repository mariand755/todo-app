# PR and push quality gate for backend and frontend code.
# First checks if any backend/ or frontend/ files actually changed (skips
# the heavy jobs if not). Then runs lint, format, type checks, and tests
# for each side in parallel. A final gate job blocks the PR if either fails.
#
# Jobs:
#   detect-relevant-changes — skips everything if only docs/CI files changed
#   test-backend            — ruff, mypy, pytest with 85% coverage minimum
#   test-frontend           — eslint, prettier, vitest with coverage
#   quality-gate            — blocks merge if any test job failed

name: Quality Checks

on:
  pull_request:
    branches: [ main ]

  push:
    branches: [ main ]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-relevant-changes:
    runs-on: ubuntu-latest

    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Detect quality-relevant changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "$base" "$head" > changed_files.txt

          if grep -E -q '^(backend/|frontend/|\.github/workflows/quality_checks\.yml)' changed_files.txt; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  test-backend:
    needs: detect-relevant-changes
    if: needs.detect-relevant-changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ./backend/

    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install uv
      run: pip install uv

    - name: Cache uv
      uses: actions/cache@v5
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
        restore-keys: |
          uv-${{ runner.os }}-

    - name: Install dependencies (including dev tools)
      run: uv sync --frozen --group dev

    # -------- QUALITY GATES --------

    - name: Lint (ruff)
      run: uv run ruff check .

    - name: Format check (ruff)
      run: uv run ruff format --check .

    - name: Type check (mypy)
      run: uv run mypy app library commandline_interface

    - name: Run tests + coverage
      run: uv run pytest -q -o addopts='' --cov=app --cov=library --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=85

    - name: Upload backend coverage artifact
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: backend-coverage-pr
        path: backend/coverage.xml
        retention-days: 14
        if-no-files-found: warn

  test-frontend:
    needs: detect-relevant-changes
    if: needs.detect-relevant-changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ./frontend/

    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.0

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Type check
      run: npm run typecheck

    - name: Format check
      run: npm run format:check

    - name: Run all tests
      run: npm run test

    - name: Run coverage
      run: npm run coverage

    - name: Upload frontend coverage artifact
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: frontend-coverage-pr
        path: frontend/coverage
        retention-days: 14
        if-no-files-found: warn

    - name: Run integration tests
      run: npm run test -- --run src/test/integration

    - name: Run unit tests
      run: npm run test -- --run src/test/unit

  quality-gate:
    needs: [detect-relevant-changes, test-backend, test-frontend]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.test-backend.result }}" == "failure" || "${{ needs.test-backend.result }}" == "cancelled" ]]; then
            echo "test-backend failed or was cancelled"
            exit 1
          fi
          if [[ "${{ needs.test-frontend.result }}" == "failure" || "${{ needs.test-frontend.result }}" == "cancelled" ]]; then
            echo "test-frontend failed or was cancelled"
            exit 1
          fi
          echo "Quality gate passed (jobs succeeded or were skipped)"
