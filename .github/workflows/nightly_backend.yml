# Nightly backend health check — runs the full quality suite (lint, type check,
# format, tests, coverage) plus a pip-audit and a Docker build with Trivy scan.
# Scheduled daily at 6am UTC so issues surface before the next working session.
#
# Jobs:
#   backend-quality-and-audit — ruff, mypy, pytest with coverage, pip-audit
#   docker-build-and-trivy    — build image, Trivy scan for HIGH/CRITICAL

name: Nightly Backend

on:
  schedule:
    # Runs at 06:00 UTC every day (≈ 1am ET / 2am ET depending on DST) - adjust as needed (cron: "0 6 * * 1" for weekly)
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-backend
  cancel-in-progress: true

jobs:
  backend-quality-and-audit:
    name: Backend quality + dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ./backend/

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies (including dev tools)
        run: uv sync --frozen --group dev

      # -------- QUALITY GATES --------
      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy app library commandline_interface

      - name: Run tests + coverage
        run: uv run pytest -q -o addopts='' --cov=app --cov=library --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=85

      - name: Upload backend coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-nightly
          path: backend/coverage.xml
          retention-days: 30
          if-no-files-found: warn

      # -------- SECURITY (SCA) --------
      - name: Export runtime requirements from lockfile
        run: uv export --frozen --format requirements.txt --no-dev --no-editable --no-emit-project --output-file runtime-requirements.txt

      - name: Dependency audit (pip-audit)
        run: uv run pip-audit -r runtime-requirements.txt | tee pip-audit-backend-nightly.txt

      - name: Upload pip-audit artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-backend-nightly
          path: backend/pip-audit-backend-nightly.txt
          retention-days: 30
          if-no-files-found: warn

  docker-build-and-trivy:
    name: Docker build + Trivy scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Builds your backend image locally (doesn't push)
      - name: Build backend image (local)
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: backend:nightly
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: backend:nightly
          format: table
          output: trivy-backend-nightly.txt
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Upload Trivy backend artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-backend-nightly
          path: trivy-backend-nightly.txt
          retention-days: 30
          if-no-files-found: warn
