name: Add To Project

on:
  issues:
    types: [opened, reopened]
  pull_request_target:
    types: [opened, reopened]
  schedule:
    - cron: '0 8 * * 1'  # Weekly Monday 8am UTC — sweep stale needs-metadata labels
  workflow_dispatch:

concurrency:
  group: add-to-project-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  add-to-project:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Validate add-to-project secret
        shell: bash
        env:
          ADD_TO_PROJECT_PAT: ${{ secrets.ADD_TO_PROJECT_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "${ADD_TO_PROJECT_PAT}" ]]; then
            echo "Missing required secret: ADD_TO_PROJECT_PAT"
            exit 1
          fi

      - name: Add issue or PR to Todo App Task Board
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT }}
        run: |
          set -euo pipefail
          ITEM_URL="${{ github.event.issue.html_url || github.event.pull_request.html_url }}"
          gh project item-add 2 --owner mariand755 --url "$ITEM_URL"

      - name: Auto-tag project item metadata
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT }}
          ITEM_TITLE: ${{ github.event.issue.title || github.event.pull_request.title }}
          ITEM_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ github.event.pull_request.number && 'true' || 'false' }}
          ITEM_LABELS: ${{ join(github.event.issue.labels.*.name || github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail

          PROJECT_OWNER="mariand755"
          PROJECT_NUMBER="2"

          # Field IDs
          PROJECT_ID="PVT_kwHOATOaf84BRQRG"
          PRIORITY_FIELD_ID="PVTSSF_lAHOATOaf84BRQRGzg_XWGw"
          AREA_FIELD_ID="PVTSSF_lAHOATOaf84BRQRGzg_XWHM"
          EFFORT_FIELD_ID="PVTSSF_lAHOATOaf84BRQRGzg_XWHQ"
          TYPE_FIELD_ID="PVTSSF_lAHOATOaf84BRQRGzg_XWGs"
          TYPE_TASK="92b3797e"

          # Priority option IDs
          P1_ID="92bd28dd"
          P2_ID="2c4c5526"
          P3_ID="292a7c3d"

          # Area option IDs
          AREA_BACKEND="d8ab51bd"
          AREA_FRONTEND="b0062d97"
          AREA_QA="988014c0"
          AREA_CICD="e773215a"
          AREA_SECURITY="b75aefc3"
          AREA_DOCS="4eb15cf5"
          AREA_FULLSTACK="20dd9126"

          # Effort option IDs
          EFFORT_XS="0c3669b8"
          EFFORT_S="8bff0bc1"

          # Classify by title pattern
          AREA_OPT=""
          PRIORITY_OPT=""
          EFFORT_OPT=""
          FALLBACK=false
          TITLE_LC="$(echo "$ITEM_TITLE" | tr '[:upper:]' '[:lower:]')"

          case "$ITEM_TITLE" in
            "chore(deps-dev):"*|"chore(deps):"*|"deps: bump"*|"Bump "*)
              # Dependabot / generic dep bumps — refine by title content
              if echo "$ITEM_TITLE" | grep -qiE '\/(frontend|node|npm|vite|vitest|eslint)'; then
                AREA_OPT="$AREA_FRONTEND"
              elif echo "$ITEM_TITLE" | grep -qiE '\/(backend|python|pip|uv|fastapi|sqlalchemy)'; then
                AREA_OPT="$AREA_BACKEND"
              else
                AREA_OPT="$AREA_CICD"
              fi
              PRIORITY_OPT="$P3_ID"
              EFFORT_OPT="$EFFORT_XS"
              ;;
            "deps(frontend):"*)
              AREA_OPT="$AREA_FRONTEND"; PRIORITY_OPT="$P3_ID"; EFFORT_OPT="$EFFORT_XS" ;;
            "deps(backend):"*)
              AREA_OPT="$AREA_BACKEND"; PRIORITY_OPT="$P3_ID"; EFFORT_OPT="$EFFORT_XS" ;;
            "deps:"*)
              AREA_OPT="$AREA_FULLSTACK"; PRIORITY_OPT="$P3_ID"; EFFORT_OPT="$EFFORT_XS" ;;
            "ci("*|"ci/docs("*)
              AREA_OPT="$AREA_CICD"; PRIORITY_OPT="$P2_ID"; EFFORT_OPT="$EFFORT_S" ;;
            "chore:"*|"chore(opencode):"*|"fix(opencode):"*|"chore(agents):"*)
              AREA_OPT="$AREA_CICD"; PRIORITY_OPT="$P3_ID"; EFFORT_OPT="$EFFORT_XS" ;;
            "security:"*)
              AREA_OPT="$AREA_SECURITY"; PRIORITY_OPT="$P1_ID"; EFFORT_OPT="$EFFORT_S" ;;
            "test:"*|"validation:"*)
              AREA_OPT="$AREA_QA"; PRIORITY_OPT="$P3_ID"; EFFORT_OPT="$EFFORT_XS" ;;
            "merge:"*)
              AREA_OPT="$AREA_CICD"; PRIORITY_OPT="$P3_ID"; EFFORT_OPT="$EFFORT_XS" ;;
            "docs:"*)
              AREA_OPT="$AREA_DOCS"; PRIORITY_OPT="$P3_ID"; EFFORT_OPT="$EFFORT_XS" ;;
            "fix(backend):"*|"feat(backend):"*)
              AREA_OPT="$AREA_BACKEND"; PRIORITY_OPT="$P2_ID"; EFFORT_OPT="$EFFORT_S" ;;
            "fix(frontend):"*|"feat(frontend):"*)
              AREA_OPT="$AREA_FRONTEND"; PRIORITY_OPT="$P2_ID"; EFFORT_OPT="$EFFORT_S" ;;
            "fix("*|"feat("*)
              AREA_OPT="$AREA_FULLSTACK"; PRIORITY_OPT="$P2_ID"; EFFORT_OPT="$EFFORT_S" ;;
            *)
              FALLBACK=true ;;
          esac

          # Keyword-based fallback for plain-language titles.
          # This keeps metadata automation working even when strict prefix
          # conventions (e.g., fix(backend):) are not used.
          if [[ "$FALLBACK" == "true" ]]; then
            if echo "$TITLE_LC" | grep -qiE 'security|vulnerability|cve|audit'; then
              AREA_OPT="$AREA_SECURITY"; PRIORITY_OPT="$P1_ID"; EFFORT_OPT="$EFFORT_S"; FALLBACK=false
            elif echo "$TITLE_LC" | grep -qiE 'backend|api|fastapi|sqlalchemy|database|postgres|migration'; then
              AREA_OPT="$AREA_BACKEND"; PRIORITY_OPT="$P2_ID"; EFFORT_OPT="$EFFORT_S"; FALLBACK=false
            elif echo "$TITLE_LC" | grep -qiE 'frontend|react|vite|vitest|eslint|ui|ux|css'; then
              AREA_OPT="$AREA_FRONTEND"; PRIORITY_OPT="$P2_ID"; EFFORT_OPT="$EFFORT_S"; FALLBACK=false
            elif echo "$TITLE_LC" | grep -qiE 'test|testing|e2e|integration|qa'; then
              AREA_OPT="$AREA_QA"; PRIORITY_OPT="$P2_ID"; EFFORT_OPT="$EFFORT_S"; FALLBACK=false
            elif echo "$TITLE_LC" | grep -qiE 'ci|workflow|actions|docker|compose|build'; then
              AREA_OPT="$AREA_CICD"; PRIORITY_OPT="$P2_ID"; EFFORT_OPT="$EFFORT_S"; FALLBACK=false
            elif echo "$TITLE_LC" | grep -qiE 'docs|documentation|readme'; then
              AREA_OPT="$AREA_DOCS"; PRIORITY_OPT="$P3_ID"; EFFORT_OPT="$EFFORT_XS"; FALLBACK=false
            fi
          fi

          # Labels override: Dependabot label always wins
          if echo "$ITEM_LABELS" | grep -q "dependencies"; then
            if echo "$ITEM_TITLE" | grep -qiE 'frontend|node|npm|vite|vitest|eslint'; then
              AREA_OPT="$AREA_FRONTEND"
            elif echo "$ITEM_TITLE" | grep -qiE 'backend|python|pip|uv|fastapi|sqlalchemy'; then
              AREA_OPT="$AREA_BACKEND"
            else
              AREA_OPT="$AREA_CICD"
            fi
            PRIORITY_OPT="$P3_ID"
            EFFORT_OPT="$EFFORT_XS"
            FALLBACK=false
          fi

          # Get project item ID for this issue/PR (with retry because the item can
          # take a few seconds to appear after add-to-project finishes).
          ITEM_JSON=""
          ITEM_ID=""
          for attempt in {1..10}; do
            ITEM_JSON=$(gh project item-list "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --limit 500 --format json \
              | jq -c --argjson num "$ITEM_NUMBER" '.items[] | select(.content.number == $num)' | head -n1)
            ITEM_ID=$(jq -r '.id // empty' <<<"${ITEM_JSON:-}")
            if [[ -n "$ITEM_ID" ]]; then
              break
            fi
            echo "Project item for #$ITEM_NUMBER not found yet (attempt ${attempt}/10); retrying..."
            sleep 3
          done

          if [[ -z "$ITEM_ID" ]]; then
            echo "Item not found in project board yet — skipping metadata tagging."
            exit 0
          fi

          # Check if metadata already set (skip to avoid overwriting manual tags).
          HAS_AREA=$(jq -r '((.area // "") | tostring | length) > 0' <<<"$ITEM_JSON")
          HAS_PRIORITY=$(jq -r '((.priority // "") | tostring | length) > 0' <<<"$ITEM_JSON")
          HAS_EFFORT=$(jq -r '((.effort // "") | tostring | length) > 0' <<<"$ITEM_JSON")
          if [[ "$HAS_AREA" == "true" && "$HAS_PRIORITY" == "true" && "$HAS_EFFORT" == "true" ]]; then
            echo "Metadata already set for item #$ITEM_NUMBER — skipping field tagging."
            # Remove needs-metadata label if still present (fields were set by
            # another path, e.g., project-board-executor via GraphQL).
            gh issue edit "$ITEM_NUMBER" --repo "$PROJECT_OWNER/todo-app" --remove-label "needs-metadata" 2>/dev/null || \
              gh pr edit "$ITEM_NUMBER" --repo "$PROJECT_OWNER/todo-app" --remove-label "needs-metadata" 2>/dev/null || true
            exit 0
          fi

          if [[ "$FALLBACK" == "true" ]]; then
            echo "No pattern matched for: $ITEM_TITLE — applying needs-metadata label."
            gh issue edit "$ITEM_NUMBER" --repo "$PROJECT_OWNER/todo-app" --add-label "needs-metadata" 2>/dev/null || \
              gh pr edit "$ITEM_NUMBER" --repo "$PROJECT_OWNER/todo-app" --add-label "needs-metadata" 2>/dev/null || true
            exit 0
          fi

          # Apply Area, Priority, Effort via GraphQL
          set_field() {
            local field_id="$1" option_id="$2"
            gh api graphql -f query='
              mutation($project: ID!, $item: ID!, $field: ID!, $value: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $project
                  itemId: $item
                  fieldId: $field
                  value: { singleSelectOptionId: $value }
                }) { projectV2Item { id } }
              }' \
              -f project="$PROJECT_ID" \
              -f item="$ITEM_ID" \
              -f field="$field_id" \
              -f value="$option_id" > /dev/null
          }

          set_field "$AREA_FIELD_ID" "$AREA_OPT"
          set_field "$PRIORITY_FIELD_ID" "$PRIORITY_OPT"
          set_field "$EFFORT_FIELD_ID" "$EFFORT_OPT"

          # Auto-tag Type=Task for PRs (issues get Type from templates or manual setup)
          if [[ "$IS_PR" == "true" ]]; then
            HAS_TYPE=$(jq -r '((.type // "") | tostring | length) > 0' <<<"$ITEM_JSON")
            if [[ "$HAS_TYPE" != "true" ]]; then
              set_field "$TYPE_FIELD_ID" "$TYPE_TASK"
              echo "Set Type=Task for PR #$ITEM_NUMBER"
            fi
          fi

          echo "Tagged item #$ITEM_NUMBER: area=$(echo $ITEM_TITLE | head -c 30)... priority/effort set."

          # Remove needs-metadata label if it was lingering from a prior run
          # (e.g., agent-created issues whose fields were set via GraphQL before
          # this workflow fired — classic race condition).
          gh issue edit "$ITEM_NUMBER" --repo "$PROJECT_OWNER/todo-app" --remove-label "needs-metadata" 2>/dev/null || \
            gh pr edit "$ITEM_NUMBER" --repo "$PROJECT_OWNER/todo-app" --remove-label "needs-metadata" 2>/dev/null || true

      - name: Fallback guidance for manual add
        if: failure()
        shell: bash
        run: |
          echo "Auto-add failed for this item."
          echo "Fallback path:"
          echo "1) Open the issue/PR in GitHub."
          echo "2) In the right sidebar, click Projects."
          echo "3) Add the item to 'Todo App Task Board' (#2)."
          echo "4) Leave a note on the issue/PR with manual add confirmation and failure context."

  sweep-needs-metadata:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Validate secret
        shell: bash
        env:
          ADD_TO_PROJECT_PAT: ${{ secrets.ADD_TO_PROJECT_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "${ADD_TO_PROJECT_PAT}" ]]; then
            echo "Missing required secret: ADD_TO_PROJECT_PAT"
            exit 1
          fi

      - name: Sweep stale needs-metadata labels
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT }}
        run: |
          set -euo pipefail

          PROJECT_OWNER="mariand755"
          REPO="mariand755/todo-app"

          echo "Scanning for issues/PRs with needs-metadata label..."
          LABELED_ITEMS=$(gh issue list --repo "$REPO" --label "needs-metadata" --state open --json number,title --jq '.[].number' 2>/dev/null || true)
          LABELED_PRS=$(gh pr list --repo "$REPO" --label "needs-metadata" --state open --json number,title --jq '.[].number' 2>/dev/null || true)
          ALL_ITEMS=$(echo -e "${LABELED_ITEMS}\n${LABELED_PRS}" | sort -u | grep -v '^$' || true)

          if [[ -z "$ALL_ITEMS" ]]; then
            echo "No open items with needs-metadata label found."
            exit 0
          fi

          BOARD_JSON=$(gh project item-list 2 --owner "$PROJECT_OWNER" --limit 500 --format json)
          REMOVED=0
          KEPT=0

          for NUM in $ALL_ITEMS; do
            ITEM=$(echo "$BOARD_JSON" | jq -c --argjson n "$NUM" '.items[] | select(.content.number == $n)' | head -n1)
            if [[ -z "$ITEM" ]]; then
              echo "#$NUM: not on project board — skipping."
              continue
            fi

            HAS_AREA=$(jq -r '((.area // "") | tostring | length) > 0' <<<"$ITEM")
            HAS_PRIORITY=$(jq -r '((.priority // "") | tostring | length) > 0' <<<"$ITEM")
            HAS_EFFORT=$(jq -r '((.effort // "") | tostring | length) > 0' <<<"$ITEM")

            if [[ "$HAS_AREA" == "true" && "$HAS_PRIORITY" == "true" && "$HAS_EFFORT" == "true" ]]; then
              echo "#$NUM: all metadata fields populated — removing needs-metadata label."
              gh issue edit "$NUM" --repo "$REPO" --remove-label "needs-metadata" 2>/dev/null || \
                gh pr edit "$NUM" --repo "$REPO" --remove-label "needs-metadata" 2>/dev/null || true
              REMOVED=$((REMOVED + 1))
            else
              echo "#$NUM: metadata still incomplete (area=$HAS_AREA, priority=$HAS_PRIORITY, effort=$HAS_EFFORT) — keeping label."
              KEPT=$((KEPT + 1))
            fi
          done

          echo "Sweep complete: $REMOVED labels removed, $KEPT labels kept."
