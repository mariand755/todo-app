# PR-time security checks for the backend. Runs pip-audit against runtime
# dependencies and a gitleaks secret scan across the full Git history.
# Skips the audit job if no backend files changed.
#
# Jobs:
#   detect-relevant-changes — skips if no backend files changed
#   dependency-audit        — pip-audit on runtime requirements
#   secret-scan             — gitleaks across full repo history

name: Security Backend

on:
  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-relevant-changes:
    runs-on: ubuntu-latest

    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Detect backend security-relevant changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"

          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "$base" "$head" > changed_files.txt

          if grep -E -q '^(backend/|.github/workflows/security_backend\.yml)' changed_files.txt; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  dependency-audit:
    needs: detect-relevant-changes
    if: needs.detect-relevant-changes.outputs.should_run == 'true'
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Sync deps (include dev)
        run: uv sync --frozen --group dev

      - name: Export runtime requirements from lockfile
        run: uv export --frozen --format requirements.txt --no-dev --no-editable --no-emit-project --output-file runtime-requirements.txt

      - name: pip-audit runtime requirements
        run: uv run pip-audit -r runtime-requirements.txt

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
