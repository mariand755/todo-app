name: Project Status Sync

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, closed]
  issues:
    types: [opened, reopened, closed]
  workflow_dispatch:

concurrency:
  group: project-status-sync-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  sync-issue-status:
    if: ${{ github.event_name == 'issues' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate project automation secret
        shell: bash
        env:
          ADD_TO_PROJECT_PAT: ${{ secrets.ADD_TO_PROJECT_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "${ADD_TO_PROJECT_PAT}" ]]; then
            echo "Missing required secret: ADD_TO_PROJECT_PAT"
            exit 1
          fi

      - name: Sync issue status to project
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT }}
        run: |
          set -euo pipefail

          PROJECT_OWNER="${GITHUB_REPOSITORY_OWNER}"
          PROJECT_NUMBER="2"

          resolve_project_metadata() {
            local graphql_query project_data

            graphql_query='query($owner: String!, $number: Int!) { user(login: $owner) { projectV2(number: $number) { id fields(first: 50) { nodes { __typename ... on ProjectV2SingleSelectField { id name options { id name } } } } } } }'

            project_data="$(gh api graphql -f query="$graphql_query" -F owner="$PROJECT_OWNER" -F number="$PROJECT_NUMBER")"

            PROJECT_ID="$(jq -r '.data.user.projectV2.id // empty' <<<"$project_data")"
            STATUS_FIELD_ID="$(jq -r '.data.user.projectV2.fields.nodes[] | select(.name=="Status") | .id' <<<"$project_data")"
            STATUS_TODO_OPTION_ID="$(jq -r '.data.user.projectV2.fields.nodes[] | select(.name=="Status") | .options[] | select(.name=="Todo") | .id' <<<"$project_data")"
            STATUS_IN_PROGRESS_OPTION_ID="$(jq -r '.data.user.projectV2.fields.nodes[] | select(.name=="Status") | .options[] | select(.name=="In Progress") | .id' <<<"$project_data")"
            STATUS_DONE_OPTION_ID="$(jq -r '.data.user.projectV2.fields.nodes[] | select(.name=="Status") | .options[] | select(.name=="Done") | .id' <<<"$project_data")"

            if [[ -z "$PROJECT_ID" || -z "$STATUS_FIELD_ID" || -z "$STATUS_TODO_OPTION_ID" || -z "$STATUS_IN_PROGRESS_OPTION_ID" || -z "$STATUS_DONE_OPTION_ID" ]]; then
              echo "Unable to resolve project metadata."
              exit 1
            fi
          }

          resolve_project_metadata

          issue_number="${{ github.event.issue.number }}"
          target_option_id="$STATUS_TODO_OPTION_ID"

          if [[ "${{ github.event.action }}" == "closed" ]]; then
            target_option_id="$STATUS_DONE_OPTION_ID"
          fi

          list_items() {
            gh project item-list "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --limit 500 --format json
          }

          get_item_id() {
            local num="$1"
            list_items | jq -r --argjson issue "$num" '.items[] | select(.content.number==$issue) | .id' | head -n1
          }

          ensure_item_id() {
            local num="$1"
            local id=""

            id="$(get_item_id "$num")"
            if [[ -n "$id" ]]; then
              printf '%s\n' "$id"
              return 0
            fi

            gh project item-add "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --url "https://github.com/${GITHUB_REPOSITORY}/issues/${num}" >/dev/null || true

            for attempt in {1..10}; do
              id="$(get_item_id "$num")"
              if [[ -n "$id" ]]; then
                printf '%s\n' "$id"
                return 0
              fi
              echo "Project item for issue #${num} not found yet (attempt ${attempt}/10); retrying..."
              sleep 3
            done

            return 1
          }

          item_id="$(ensure_item_id "$issue_number" || true)"

          if [[ -z "$item_id" ]]; then
            echo "Unable to locate project item for issue #${issue_number}"
            exit 1
          fi

          gh project item-edit \
            --id "$item_id" \
            --project-id "$PROJECT_ID" \
            --field-id "$STATUS_FIELD_ID" \
            --single-select-option-id "$target_option_id"

  sync-pr-linked-issues:
    if: ${{ github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate project automation secret
        shell: bash
        env:
          ADD_TO_PROJECT_PAT: ${{ secrets.ADD_TO_PROJECT_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "${ADD_TO_PROJECT_PAT}" ]]; then
            echo "Missing required secret: ADD_TO_PROJECT_PAT"
            exit 1
          fi

      - name: Move linked issues to In Progress
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT }}
        run: |
          set -euo pipefail

          PROJECT_OWNER="${GITHUB_REPOSITORY_OWNER}"
          PROJECT_NUMBER="2"

          resolve_project_metadata() {
            local graphql_query project_data

            graphql_query='query($owner: String!, $number: Int!) { user(login: $owner) { projectV2(number: $number) { id fields(first: 50) { nodes { __typename ... on ProjectV2SingleSelectField { id name options { id name } } } } } } }'

            project_data="$(gh api graphql -f query="$graphql_query" -F owner="$PROJECT_OWNER" -F number="$PROJECT_NUMBER")"

            PROJECT_ID="$(jq -r '.data.user.projectV2.id // empty' <<<"$project_data")"
            STATUS_FIELD_ID="$(jq -r '.data.user.projectV2.fields.nodes[] | select(.name=="Status") | .id' <<<"$project_data")"
            STATUS_TODO_OPTION_ID="$(jq -r '.data.user.projectV2.fields.nodes[] | select(.name=="Status") | .options[] | select(.name=="Todo") | .id' <<<"$project_data")"
            STATUS_IN_PROGRESS_OPTION_ID="$(jq -r '.data.user.projectV2.fields.nodes[] | select(.name=="Status") | .options[] | select(.name=="In Progress") | .id' <<<"$project_data")"
            STATUS_DONE_OPTION_ID="$(jq -r '.data.user.projectV2.fields.nodes[] | select(.name=="Status") | .options[] | select(.name=="Done") | .id' <<<"$project_data")"

            if [[ -z "$PROJECT_ID" || -z "$STATUS_FIELD_ID" || -z "$STATUS_TODO_OPTION_ID" || -z "$STATUS_IN_PROGRESS_OPTION_ID" || -z "$STATUS_DONE_OPTION_ID" ]]; then
              echo "Unable to resolve project metadata."
              exit 1
            fi
          }

          resolve_project_metadata

          pr_body="$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")"
          event_action="${{ github.event.action }}"
          is_merged="${{ github.event.pull_request.merged || false }}"

          target_option_id="$STATUS_IN_PROGRESS_OPTION_ID"
          issue_reference_pattern='(close[sd]?|fix(e[sd])?|resolve[sd]?|refs?|part of)[[:space:]]+#([0-9]+)'

          if [[ "$event_action" == "closed" ]]; then
            if [[ "$is_merged" != "true" ]]; then
              echo "PR closed without merge. No status sync needed."
              exit 0
            fi

            target_option_id="$STATUS_DONE_OPTION_ID"
            issue_reference_pattern='(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#([0-9]+)'
          fi

          if [[ -z "$pr_body" ]]; then
            echo "PR body is empty. Nothing to sync."
            exit 0
          fi

          issue_numbers="$(
            printf '%s\n' "$pr_body" \
              | grep -oiE "$issue_reference_pattern" \
              | grep -oE '[0-9]+' \
              | sort -u \
              || true
          )"

          if [[ -z "$issue_numbers" ]]; then
            echo "No linked issue references found in PR body."
            exit 0
          fi

          list_items() {
            gh project item-list "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --limit 500 --format json
          }

          get_item_id() {
            local num="$1"
            list_items | jq -r --argjson issue "$num" '.items[] | select(.content.number==$issue) | .id' | head -n1
          }

          ensure_item_id() {
            local num="$1"
            local id=""

            id="$(get_item_id "$num")"
            if [[ -n "$id" ]]; then
              printf '%s\n' "$id"
              return 0
            fi

            gh project item-add "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --url "https://github.com/${GITHUB_REPOSITORY}/issues/${num}" >/dev/null || true

            for attempt in {1..10}; do
              id="$(get_item_id "$num")"
              if [[ -n "$id" ]]; then
                printf '%s\n' "$id"
                return 0
              fi
              echo "Project item for issue #${num} not found yet (attempt ${attempt}/10); retrying..."
              sleep 3
            done

            return 1
          }

          while IFS= read -r issue_number; do
            [[ -z "$issue_number" ]] && continue

            if ! gh issue view "$issue_number" --json state >/dev/null 2>&1; then
              echo "Skipping #${issue_number}: issue not found in this repository."
              continue
            fi

            issue_state="$(gh issue view "$issue_number" --json state --jq '.state')"
            if [[ "$target_option_id" == "$STATUS_IN_PROGRESS_OPTION_ID" && "$issue_state" != "OPEN" ]]; then
              echo "Skipping #${issue_number}: issue state is ${issue_state}."
              continue
            fi

            item_id="$(ensure_item_id "$issue_number" || true)"

            if [[ -z "$item_id" ]]; then
              echo "Unable to locate project item for issue #${issue_number}."
              exit 1
            fi

            gh project item-edit \
              --id "$item_id" \
              --project-id "$PROJECT_ID" \
              --field-id "$STATUS_FIELD_ID" \
              --single-select-option-id "$target_option_id"
          done <<< "$issue_numbers"
