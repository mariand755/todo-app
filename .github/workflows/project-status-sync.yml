name: Project Status Sync

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  issues:
    types: [opened, reopened, closed]
  workflow_dispatch:

concurrency:
  group: project-status-sync-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: read
  pull-requests: read

env:
  PROJECT_NUMBER: "2"
  PROJECT_OWNER: mariand755
  PROJECT_ID: PVT_kwHOATOaf84BRQRG
  STATUS_FIELD_ID: PVTSSF_lAHOATOaf84BRQRGzg_IrGk
  STATUS_TODO_OPTION_ID: f75ad846
  STATUS_IN_PROGRESS_OPTION_ID: 47fc9ee4
  STATUS_DONE_OPTION_ID: 98236657

jobs:
  sync-issue-status:
    if: ${{ github.event_name == 'issues' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate add-to-project secret
        shell: bash
        env:
          ADD_TO_PROJECT_PAT: ${{ secrets.ADD_TO_PROJECT_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "${ADD_TO_PROJECT_PAT}" ]]; then
            echo "Missing required secret: ADD_TO_PROJECT_PAT"
            exit 1
          fi

      - name: Sync issue status to project
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT }}
        run: |
          set -euo pipefail

          issue_number="${{ github.event.issue.number }}"
          target_option_id="$STATUS_TODO_OPTION_ID"

          if [[ "${{ github.event.action }}" == "closed" ]]; then
            target_option_id="$STATUS_DONE_OPTION_ID"
          fi

          list_items() {
            gh project item-list "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --limit 500 --format json
          }

          get_item_id() {
            local num="$1"
            list_items | jq -r --argjson issue "$num" '.items[] | select(.content.number==$issue) | .id' | head -n1
          }

          item_id="$(get_item_id "$issue_number")"

          if [[ -z "$item_id" ]]; then
            gh project item-add "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --url "https://github.com/${GITHUB_REPOSITORY}/issues/${issue_number}" >/dev/null
            item_id="$(get_item_id "$issue_number")"
          fi

          if [[ -z "$item_id" ]]; then
            echo "Unable to locate project item for issue #${issue_number}"
            exit 1
          fi

          gh project item-edit \
            --id "$item_id" \
            --project-id "$PROJECT_ID" \
            --field-id "$STATUS_FIELD_ID" \
            --single-select-option-id "$target_option_id"

  sync-pr-linked-issues:
    if: ${{ github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate add-to-project secret
        shell: bash
        env:
          ADD_TO_PROJECT_PAT: ${{ secrets.ADD_TO_PROJECT_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "${ADD_TO_PROJECT_PAT}" ]]; then
            echo "Missing required secret: ADD_TO_PROJECT_PAT"
            exit 1
          fi

      - name: Move linked issues to In Progress
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT }}
        run: |
          set -euo pipefail

          pr_body="$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")"

          if [[ -z "$pr_body" ]]; then
            echo "PR body is empty. Nothing to sync."
            exit 0
          fi

          issue_numbers="$(
            printf '%s\n' "$pr_body" \
              | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?|refs?|part of)[[:space:]]+#([0-9]+)' \
              | grep -oE '[0-9]+' \
              | sort -u \
              || true
          )"

          if [[ -z "$issue_numbers" ]]; then
            echo "No linked issue references found in PR body."
            exit 0
          fi

          list_items() {
            gh project item-list "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --limit 500 --format json
          }

          get_item_id() {
            local num="$1"
            list_items | jq -r --argjson issue "$num" '.items[] | select(.content.number==$issue) | .id' | head -n1
          }

          while IFS= read -r issue_number; do
            [[ -z "$issue_number" ]] && continue

            if ! gh issue view "$issue_number" --json state >/dev/null 2>&1; then
              echo "Skipping #${issue_number}: issue not found in this repository."
              continue
            fi

            issue_state="$(gh issue view "$issue_number" --json state --jq '.state')"
            if [[ "$issue_state" != "OPEN" ]]; then
              echo "Skipping #${issue_number}: issue state is ${issue_state}."
              continue
            fi

            item_id="$(get_item_id "$issue_number")"
            if [[ -z "$item_id" ]]; then
              gh project item-add "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --url "https://github.com/${GITHUB_REPOSITORY}/issues/${issue_number}" >/dev/null
              item_id="$(get_item_id "$issue_number")"
            fi

            if [[ -z "$item_id" ]]; then
              echo "Unable to locate project item for issue #${issue_number}."
              exit 1
            fi

            gh project item-edit \
              --id "$item_id" \
              --project-id "$PROJECT_ID" \
              --field-id "$STATUS_FIELD_ID" \
              --single-select-option-id "$STATUS_IN_PROGRESS_OPTION_ID"
          done <<< "$issue_numbers"
