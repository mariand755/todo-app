name: Test Backend
on:
  # Run tests on every pull request targeting the main branch
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'  # Only run tests if files in the backend directory are changed

  # Allow manual triggering of this workflow
  workflow_dispatch:

jobs:
  test-backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend/

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install uv
      run: pip install uv

    - name: Cache uv
      uses: actions/cache@v4
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
        restore-keys: |
          uv-${{ runner.os }}-

    - name: Install dependencies (including dev tools)
      run: uv sync --group dev

    # -------- QUALITY GATES --------

    - name: Lint (ruff)
      run: uv run ruff check .

    - name: Format check (ruff)
      run: uv run ruff format --check .

    - name: Type check (mypy)
      run: uv run mypy .

    - name: Run tests + coverage
      run: uv run pytest --cov=app --cov=library --cov-report=term-missing --cov-fail-under=85
