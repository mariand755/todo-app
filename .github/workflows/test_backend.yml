name: Quality Checks

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/test_backend.yml'

  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/test_backend.yml'

  workflow_dispatch:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ./backend/

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5.1.0
      with:
        python-version: '3.12'

    - name: Install uv
      run: pip install uv

    - name: Cache uv
      uses: actions/cache@b7e8d49f17405cc70c1c120101943203c98d3a4b # v4.0.2
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
        restore-keys: |
          uv-${{ runner.os }}-

    - name: Install dependencies (including dev tools)
      run: uv sync --frozen --group dev

    # -------- QUALITY GATES --------

    - name: Lint (ruff)
      run: uv run ruff check .

    - name: Format check (ruff)
      run: uv run ruff format --check .

    - name: Type check (mypy)
      run: uv run mypy app library commandline_interface

    - name: Run tests + coverage
      run: uv run pytest -q -o addopts='' --cov=app --cov=library --cov-report=term-missing --cov-fail-under=85

  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ./frontend/

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Type check
      run: npm run typecheck

    - name: Format check
      run: npm run format:check

    - name: Run all tests
      run: npm run test

    - name: Run integration tests
      run: npm run test -- --run src/test/integration

    - name: Run unit tests
      run: npm run test -- --run src/test/unit
