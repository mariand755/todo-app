name: Test Backend

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'

  workflow_dispatch:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ./backend/

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.1.0
      with:
        python-version: '3.12'

    - name: Install uv
      run: pip install uv

    - name: Cache uv
      uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.0.2
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
        restore-keys: |
          uv-${{ runner.os }}-

    - name: Install dependencies (including dev tools)
      run: uv sync --frozen --group dev

    # -------- QUALITY GATES --------

    - name: Lint (ruff)
      run: uv run ruff check .

    - name: Format check (ruff)
      run: uv run ruff format --check .

    - name: Type check (mypy)
      run: uv run mypy app library commandline_interface

    - name: Run tests + coverage
      run: uv run pytest --cov=app --cov=library --cov-report=term-missing --cov-fail-under=85
